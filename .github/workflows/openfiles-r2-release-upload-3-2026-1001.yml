name: Upload macOS 3.2026.1001
on: workflow_dispatch
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify CDN assets and upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cd release
          cat > checksums.txt <<'SUMS'
          a5d6b522ba40eaa83bdaee358b0c5512a14332f8ebd8c32eb33b34664061f932  OpenFiles-3.2026.1001-mac.zip
          8a91b2b3540624f46b31c231efb55dc2c6232f2aa4c6acbd0a11a4ab23241fcb  OpenFiles-3.2026.1001-mac.zip.blockmap
          5ff345e63b699748e8e87eb785c40842a1eca5d58007c698ec0fe4cec4d4840d  OpenFiles-3.2026.1001-arm64-mac.zip
          1baf851fffa45650b39f906a8c48259da2739d89488791d5a585f2bacd9d1f82  OpenFiles-3.2026.1001-arm64-mac.zip.blockmap
          927ca42862a9342dce8d57cb70aa70695d6b6dd487bcbcda9cb20dafc4b03660  OpenFiles-3.2026.1001.dmg
          0bc8b7e4422604b0cc8bd8f96ffa83c85601bd7f07eec0d6e31e2beaceb0cab5  OpenFiles-3.2026.1001.dmg.blockmap
          767037385dadd82c057f10daadc338f67b39f47a5b03f65a305b5edab10840a2  OpenFiles-3.2026.1001-arm64.dmg
          056f2bdcf6861960c46c6a1e5a33e781749a637d149062bbffee83b9f96a51fa  OpenFiles-3.2026.1001-arm64.dmg.blockmap
          SUMS
          while read -r digest asset; do
            curl -fL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 -o "$asset" "https://cdn.pansysoft.app/releases/$asset"
            echo "$digest  $asset" | sha256sum -c -
            gh release upload 3.2026.1001 "$asset" --repo pansysoft/openfiles.desktop --clobber
          done < checksums.txt
