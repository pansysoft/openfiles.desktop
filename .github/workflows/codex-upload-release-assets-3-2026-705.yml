name: Upload release assets 3.2026.705

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          tag="3.2026.705"
          base="https://cdn.pansysoft.app/releases"
          mkdir -p release

          download_upload() {
            local url="$1"
            local name="$2"
            echo "::group::${name}"
            curl -fL --progress-bar --connect-timeout 30 --max-time 1800 --retry 5 --retry-delay 5 --retry-all-errors -o "release/${name}" "${base}/${url}"
            ls -lh "release/${name}"
            gh release upload "${tag}" "release/${name}" --repo "${repo}" --clobber
            rm -f "release/${name}"
            echo "::endgroup::"
          }

          download_upload "OpenFiles%20Setup%203.2026.705.exe" "OpenFiles.Setup.3.2026.705.exe"
          download_upload "OpenFiles%20Setup%203.2026.705.exe.blockmap" "OpenFiles.Setup.3.2026.705.exe.blockmap"
          download_upload "OpenFiles%203.2026.705.appx" "OpenFiles.3.2026.705.appx"
          download_upload "OpenFiles%203.2026.705%20arm64.appx" "OpenFiles.3.2026.705.arm64.appx"