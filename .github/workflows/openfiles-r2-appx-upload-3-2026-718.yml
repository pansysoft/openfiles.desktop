name: Upload 3.2026.718 APPX Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download APPX assets from R2 and upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 5 --output "OpenFiles 3.2026.718.appx" "https://cdn.pansysoft.app/releases/OpenFiles%203.2026.718.appx"
          curl --fail --location --retry 5 --output "OpenFiles 3.2026.718 arm64.appx" "https://cdn.pansysoft.app/releases/OpenFiles%203.2026.718%20arm64.appx"
          gh release upload "3.2026.718" "OpenFiles 3.2026.718.appx" "OpenFiles 3.2026.718 arm64.appx" --repo "${{ github.repository }}" --clobber