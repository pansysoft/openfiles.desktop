name: Upload R2 Release Assets

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      base_url:
        required: true
        type: string
      assets_json:
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download assets from R2 and upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS_JSON: ${{ inputs.assets_json }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          base="${{ inputs.base_url }}"
          mkdir -p release
          node <<'NODE'
          const fs = require('node:fs');
          const assets = JSON.parse(process.env.ASSETS_JSON || '[]');
          if (!Array.isArray(assets) || assets.length === 0) throw new Error('No assets');
          for (const asset of assets) {
            if (typeof asset !== 'string' || !asset || asset.includes('/') || asset.includes('\\')) {
              throw new Error(`Invalid asset: ${JSON.stringify(asset)}`);
            }
          }
          fs.writeFileSync('assets.txt', assets.join('\n') + '\n');
NODE
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            echo "::group::${asset}"
            curl -fL --progress-bar --connect-timeout 30 --max-time 1800 --retry 5 --retry-delay 5 --retry-all-errors -o "release/${asset}" "${base}/${asset}"
            ls -lh "release/${asset}"
            gh release upload "${version}" "release/${asset}" --repo "${{ github.repository }}" --clobber
            rm -f "release/${asset}"
            echo "::endgroup::"
          done < assets.txt